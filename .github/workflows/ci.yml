
  name: User Service CI

  on:
    push:
      branches:
        - main
        - develop
      paths:
        - 'user-service/**'
        - '.github/workflows/ci.yml'

    pull_request:
      branches:
        - main
        - develop
      paths:
        - 'user-service/**'
        - '.github/workflows/ci.yml'

  jobs:
    build:

      runs-on: ubuntu-latest

      defaults:
        run:
          working-directory: user-service

      steps:

        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Java
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: maven

        - name: Build and Test
          run: ./mvnw clean verify
