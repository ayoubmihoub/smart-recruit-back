
  name: User Service CI

  on:
    push:
      branches:
        - main
        - develop
      paths:
        - 'user-service/**'
        - '.github/workflows/ci.yml'

    pull_request:
      branches:
        - main
        - develop
      paths:
        - 'user-service/**'
        - '.github/workflows/ci.yml'

  jobs:
    build:
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:17
          env:
            POSTGRES_DB: smart-recruit
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
          ports:
            - 5432:5432
          options: >-
            --health-cmd="pg_isready -U postgres -d smart-recruit"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=5

      defaults:
        run:
          working-directory: user-service

      steps:
        - name: Checkout
          uses: actions/checkout@v5

        - name: Setup Java
          uses: actions/setup-java@v5
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: maven

        - name: Build and Test
          run: ./mvnw clean verify
