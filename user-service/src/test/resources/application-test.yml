spring:
  application:
    name: user-service

  config:
    import: ""

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  mail:
    host: localhost
    port: 1025

eureka:
  client:
    enabled: false

keycloak:
  server-url: http://localhost:8081
  realm: smart-recruit
  admin-realm: master
  admin-client-id: admin-cli
  admin-username: test
  admin-password: test
  client-id: test
  client-secret: test

logging:
  level:
    org.springframework.web: DEBUG