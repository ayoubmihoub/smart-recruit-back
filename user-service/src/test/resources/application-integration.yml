spring:
  application:
    name: user-service

  config:
    import: ""

  datasource:
    url: jdbc:postgresql://localhost:5432/smart-recruit
    username: postgres
    password: "***"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: localhost
    port: 1025

eureka:
  client:
    enabled: false

keycloak:
  server-url: http://localhost:8081
  realm: smart-recruit
  admin-realm: master
  admin-client-id: admin-cli
  admin-username: test
  admin-password: test
  client-id: test
  client-secret: test

app:
  frontend-url: http://localhost:4200

logging:
  level:
    org.springframework.web: DEBUG